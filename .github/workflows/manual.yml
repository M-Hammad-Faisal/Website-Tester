name: Website Tester

on:
  workflow_dispatch:
    inputs:
      framework:
        description: "Select the framework"
        required: true
        type: choice
        options:
          - playwright
          - selenium
        default: playwright
      browser:
        description: "Select the browser"
        required: true
        type: choice
        options:
          - chrome
          - firefox
          - edge
        default: chrome

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Run tests
        run: |
          python -m src.runners.runner --framework=${{ inputs.framework }} --test-browser=${{ inputs.browser }} --numprocesses=2 --report=allure
        timeout-minutes: 10

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ inputs.framework }}-${{ inputs.browser }}
          path: allure-results/